services:
  firefly:
    image: fireflyiii/core:latest
    restart: unless-stopped
    depends_on:
      firefly-db:
        condition: service_healthy
    env_file: .env.firefly
    ports:
      - "8080:8080"
    volumes:
      - firefly_upload:/var/www/html/storage/upload

  firefly-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: firefly
      POSTGRES_PASSWORD: firefly
      POSTGRES_DB: firefly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firefly -d firefly"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - firefly_db:/var/lib/postgresql/data

  agent-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "5433:5432"
    volumes:
      - agent_db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # 启动前自动执行数据库迁移,免手动 alembic
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://copilot:copilot@agent-db:5432/copilot
      REDIS_URL: redis://redis:6379/0
      FIREFLY_BASE_URL: http://firefly:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    ports:
      - "8000:8000"
    depends_on:
      agent-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel INFO
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://copilot:copilot@agent-db:5432/copilot
      REDIS_URL: redis://redis:6379/0
      FIREFLY_BASE_URL: http://firefly:8080
    depends_on:
      agent-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: celery -A app.worker.celery_app beat --loglevel INFO
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: python -m app.bot.runner
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://copilot:copilot@agent-db:5432/copilot
      REDIS_URL: redis://redis:6379/0
      FIREFLY_BASE_URL: http://firefly:8080
    depends_on:
      agent-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  firefly_upload:
  firefly_db:
  agent_db:
